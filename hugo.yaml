# Hugo configuration file
baseURL: https://llm-workshop.thalhath.org/
title: Local LLM Workshop

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Workshop
      pageRef: /v3/
      weight: 1
    - name: Before you start
      pageRef: /v3/before-you-start/
      weight: 2
    - name: Part 1
      pageRef: /v3/part1/
      weight: 3
    - name: Part 2
      pageRef: /v3/part2/
      weight: 4
    - name: Resources
      pageRef: /v3/resources/
      weight: 5
    - name: Archive
      weight: 6
      params:
        type: dropdown   # falls back to a plain link if the theme version has no dropdown
    - name: 2025 edition
      pageRef: /v2/
      parent: Archive
      weight: 1
    - name: 2024 edition
      pageRef: /v1/
      parent: Archive
      weight: 2
    - name: Search
      weight: 7
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: normal
    tabs:
      sync: true
  theme:
    default: light
    displayToggle: true
  footer:
    displayCopyright: false
    displayPoweredBy: false
  imageZoom:
    enable: true
  editURL:
    enable: true
    base: "https://github.com/nishad/llm-workshop/edit/main/content"
